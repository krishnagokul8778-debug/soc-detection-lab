# Linux telemetry macros (Ubuntu victim -> index=linux).
# Kept in the Linux app so it deploys standalone. Switch the sourcetype here if
# you install Splunk_TA_nix and want its CIM-normalized sourcetypes.

# auditd records. Auto-extracted key=value fields include: type, key, comm,
# exe, auid, uid, success, name, syscall.
[linux_audit]
definition = index=linux sourcetype="linux:audit"
iseval = 0

# execve records only -- the Linux equivalent of Sysmon process-create.
[linux_exec]
definition = `linux_audit` type=SYSCALL key=proc_exec
iseval = 0

# SSH / sudo / su auth events from auth.log.
[linux_auth]
definition = index=linux sourcetype="linux_secure"
iseval = 0

# Real interactive/service users. auid 4294967295 (unset) is filtered because
# unattributed events are noise, not activity.
[linux_real_user]
definition = auid!=4294967295 auid!="unset"
iseval = 0
