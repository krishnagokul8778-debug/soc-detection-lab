[SOCLAB-LNX - T1105 - Download-and-Execute via Curl or Wget Piped to Shell]
search = `linux_exec` `linux_real_user` comm IN ("curl","wget") \
| stats values(comm) as tools, values(exe) as exes, min(_time) as _time, \
        values(auid) as auid by host, ppid \
| join type=inner host, ppid \
    [ search `linux_exec` comm IN ("bash","sh","dash","python3","perl") \
      | stats count by host, ppid ] \
| eval detection_name = "Curl/Wget Piped to Shell", \
       mitre_technique = "T1105", \
       risk_score = 70 \
| table _time, host, auid, ppid, tools, exes, detection_name, mitre_technique, risk_score
description = The `curl http://x | bash` ingress-tool-transfer pattern: a download utility and a shell interpreter executed under the same parent process. Joining on host+ppid ties the two execs together, far higher fidelity than alerting on curl alone.\
\
ATT&CK: T1105 (Ingress Tool Transfer), T1059.004. Data source: auditd (execve).\
FALSE POSITIVES: real -- install scripts legitimately do this. Tune by parent and destination. TRIAGE: recover the URL from the proctitle; check what the shell did next.
