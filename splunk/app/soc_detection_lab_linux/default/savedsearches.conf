[SOCLAB-LNX - T1547.006 - Kernel Module Loaded]
search = `linux_audit` key=kernel_module \
| search (syscall IN ("init_module","finit_module") OR comm IN ("insmod","modprobe")) \
| eval detection_name = "Kernel Module Loaded", \
       mitre_technique = "T1547.006", \
       risk_score = 78 \
| table _time, host, auid, uid, comm, exe, name, syscall, detection_name, mitre_technique, risk_score
description = Loading a kernel module -- the mechanism behind LKM rootkits, which hide processes, files and connections from userspace tools. High severity because a kernel rootkit undermines every other detection on the host.\
\
ATT&CK: T1547.006 (Kernel Modules and Extensions). Data source: auditd (init_module/finit_module + insmod/modprobe).\
FALSE POSITIVES: legitimate driver loads at boot and on hardware change -- baseline the expected set; interactive module loads by a logged-in user are the concern. TRIAGE: identify the module and whether it is signed/known; an unsigned module from a user path is a rootkit until proven otherwise.
