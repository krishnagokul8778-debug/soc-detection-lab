###########################  DEFENSE EVASION  #########################

[SOCLAB-LNX - T1070 - Log or Audit Tampering]
search = `linux_audit` (key=log_tamper OR key=auditd_tamper) `linux_real_user` \
| search (comm IN ("rm","shred","truncate","unlink","auditctl") OR (key=auditd_tamper AND comm!="auditd")) \
| eval detection_name = "Log / Audit Tampering", \
       mitre_technique = "T1070", \
       risk_score = 88 \
| table _time, host, auid, uid, comm, exe, name, key, detection_name, mitre_technique, risk_score
description = Attempts to destroy or truncate auth.log/syslog, or to stop/alter auditd itself. Because auditd rules in this lab are set immutable (-e 2), an attempt to change them is itself logged -- clearing the trail is loud by design.\
\
ATT&CK: T1070 (Indicator Removal). Data source: auditd (key=log_tamper / auditd_tamper).\
FALSE POSITIVES: logrotate touches these files but runs as a known service context, not an interactive user. TRIAGE: anything already forwarded to Splunk is now your only copy -- the argument for real-time off-host forwarding. Reconstruct the pre-tamper timeline from indexed data.
