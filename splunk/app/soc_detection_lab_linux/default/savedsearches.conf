########################################################################
# SOC Detection Lab -- LINUX correlation searches  (Ubuntu victim -> index=linux)
#
# Same conventions as the Windows catalog: each rule emits
# detection_name + mitre_technique + risk_score and summary-indexes to
# `notable`, so the Windows app's risk-rollup search covers Linux hosts with
# no change. Telemetry is auditd (key=value auto-extracted) + auth.log.
########################################################################


##############################  CREDENTIAL ACCESS  #####################

[SOCLAB-LNX - T1110 - SSH Brute Force Followed by Success]
search = `linux_auth` sshd \
| rex field=_raw "(?<auth_result>Failed|Accepted) password for (?:invalid user )?(?<target_user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})" \
| where isnotnull(auth_result) \
| bin _time span=5m \
| stats count(eval(auth_result=="Failed")) as failures, \
        count(eval(auth_result=="Accepted")) as successes, \
        dc(target_user) as users_tried, \
        values(src_ip) as src_ips \
        by _time, host \
| where failures >= 10 \
| eval outcome = if(successes > 0, "SUCCESS AFTER FAILURES", "failures only"), \
       risk_score = if(successes > 0, 90, 45), \
       detection_name = "SSH Brute Force", \
       mitre_technique = if(users_tried > 5, "T1110.003", "T1110.001") \
| table _time, host, failures, successes, users_tried, outcome, src_ips, detection_name, mitre_technique, risk_score
description = SSH password brute force / spray, bucketed into 5-minute windows off auth.log. Technique is assigned dynamically: many failed users = spraying (T1110.003), one repeated user = guessing (T1110.001). Risk doubles when an Accepted lands in the same window as the failures -- a probable successful compromise, not just noise.\
\
ATT&CK: T1110.001 / T1110.003. Data source: auth.log (sshd).\
FALSE POSITIVES: a misconfigured client or expired key retries and looks like guessing; check whether src_ip is known. TRIAGE: if a success followed, pull everything that session did next; internal src_ip means an already-compromised host.
cron_schedule = 2,17,32,47 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
action.summary_index = 1
action.summary_index._name = notable
counttype = number of events
quantity = 0
relation = greater than


[SOCLAB-LNX - T1003.008 - Shadow or Passwd File Accessed]
search = `linux_audit` key=cred_access `linux_real_user` \
| search (name="/etc/shadow" OR name="/etc/gshadow" OR name="/etc/security/opasswd") \
| search (uid!=0 OR comm IN ("cat","less","more","cp","vi","vim","nano","head","tail","xxd","base64","python3","python","perl")) \
| eval detection_name = "Shadow/Passwd File Accessed", \
       mitre_technique = "T1003.008", \
       risk_score = 85 \
| table _time, host, auid, uid, comm, exe, name, key, detection_name, mitre_technique, risk_score
description = Detects reads of /etc/shadow and friends -- offline credential theft. Root touches shadow during normal PAM operations, so the rule filters to non-root access or access via a shell/editor/copy/encoder, which is the shape of an attacker exfiltrating hashes.\
\
ATT&CK: T1003.008 (OS Credential Dumping: /etc/passwd and /etc/shadow). Data source: auditd (key=cred_access).\
FALSE POSITIVES: backup agents and some config-management tools read shadow -- allowlist by exe. TRIAGE: identify the reader and whether the hashes left the host; treat every local credential as burned if they did.
