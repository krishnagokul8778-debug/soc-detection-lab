[SOCLAB-LNX - T1136.001 - Local Account Created]
search = (`linux_audit` key=account_mod comm IN ("useradd","adduser","groupadd")) \
      OR (`linux_auth` ("new user:" OR "new group:")) \
| eval detection_name = "Local Account Created", \
       mitre_technique = "T1136.001", \
       risk_score = 60 \
| table _time, host, auid, uid, comm, exe, _raw, detection_name, mitre_technique, risk_score
description = Account creation via useradd/adduser/groupadd (auditd) or the corresponding "new user:" line in auth.log. A backdoor account is a common persistence step, especially right after an SSH brute-force success.\
\
ATT&CK: T1136.001. Data source: auditd (key=account_mod) + auth.log.\
FALSE POSITIVES: legitimate provisioning -- discriminate by actor and timing. TRIAGE: check the new account's uid, shell, and whether it was added to sudo/wheel immediately (correlate with the sudoers rule); disable rather than delete for forensics.
