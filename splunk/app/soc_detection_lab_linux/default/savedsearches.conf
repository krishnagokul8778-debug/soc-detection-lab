##############################  DISCOVERY  ############################

[SOCLAB-LNX - T1082 - Host Discovery Command Burst]
search = `linux_audit` key=discovery `linux_real_user` \
| bin _time span=10m \
| stats dc(comm) as distinct_tools, values(comm) as tools_used, \
        values(exe) as exes, count as total_execs by _time, host, auid \
| where distinct_tools >= 5 \
| eval detection_name = "Host Discovery Command Burst", \
       mitre_technique = "T1082", \
       risk_score = 20 + (distinct_tools * 8) \
| table _time, host, auid, distinct_tools, tools_used, total_execs, detection_name, mitre_technique, risk_score
description = Behavioural detection: five or more distinct discovery utilities (whoami, id, uname, hostname, ss/netstat, who) from one user inside ten minutes. Like the Windows discovery-burst rule, it detects the human running a checklist rather than any single tool, so it survives tool substitution -- the strongest thing to lead with in an interview.\
\
ATT&CK: T1082 / T1033 / T1049 / T1087. Data source: auditd (key=discovery).\
FALSE POSITIVES: a genuine admin troubleshooting; discriminate by whether the session was interactive and what preceded it. TRIAGE: look at what ran seconds before the burst (initial access) and after it (credential access / lateral movement).
