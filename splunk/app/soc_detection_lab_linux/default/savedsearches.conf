#############################  PERSISTENCE  ###########################

[SOCLAB-LNX - T1053.003 - Cron Persistence]
search = `linux_audit` key=persist_cron `linux_real_user` \
| eval detection_name = "Cron Persistence", \
       mitre_technique = "T1053.003", \
       risk_score = 65 \
| table _time, host, auid, uid, comm, exe, name, detection_name, mitre_technique, risk_score
description = Writes to crontab, /etc/cron.d, /etc/cron.daily or a user crontab spool -- scheduled-task persistence on Linux. Survives reboot and runs on a timer, often as root.\
\
ATT&CK: T1053.003 (Cron). Data source: auditd (key=persist_cron).\
FALSE POSITIVES: package installs drop cron files -- correlate with apt/dpkg activity. TRIAGE: read the cron entry's command; a shell one-liner or a script in /tmp or /dev/shm is malicious.
