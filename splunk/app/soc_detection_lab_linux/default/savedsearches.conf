##############################  EXECUTION  ############################

[SOCLAB-LNX - T1059.004 - Reverse Shell Indicators]
search = `linux_audit` (type=PROCTITLE OR type=SYSCALL) `linux_real_user` \
| eval rev = case( \
      match(proctitle, "2f6465762f746370") OR match(proctitle, "2f6465762f756470"), "bash /dev/tcp socket", \
      comm IN ("nc","ncat","netcat","socat","socat1"), "netcat/socat", \
      match(proctitle, "736f636b65742e736f636b657428"), "python socket()", \
      true(), null()) \
| where isnotnull(rev) \
| eval detection_name = "Reverse Shell Indicators", \
       mitre_technique = "T1059.004", \
       risk_score = 92 \
| table _time, host, auid, uid, comm, exe, rev, proctitle, detection_name, mitre_technique, risk_score
description = Detects interactive reverse shells. auditd hex-encodes the proctitle, so rather than fight that, the rule matches the hex of the tell-tale strings -- "/dev/tcp" (2f6465762f746370) and "/dev/udp" for bash socket shells, plus comm-based matches for nc/ncat/socat and the hex of python's socket.socket(. Matching hex substrings directly is a demonstrable way around auditd's encoding.\
\
ATT&CK: T1059.004 (Unix Shell). Data source: auditd (PROCTITLE + SYSCALL).\
FALSE POSITIVES: low; socat/nc have admin uses -- correlate with an outbound connection to an external IP. TRIAGE: near-confirmed compromise; identify the peer address, then walk the parent chain back to initial access.
