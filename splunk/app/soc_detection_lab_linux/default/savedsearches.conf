[SOCLAB-LNX - T1543.002 - Systemd Service or Timer Persistence]
search = `linux_audit` key=persist_systemd `linux_real_user` \
| search (match(name, "\.service$") OR match(name, "\.timer$") OR match(name, "systemd/system")) \
| eval detection_name = "Systemd Service/Timer Persistence", \
       mitre_technique = "T1543.002", \
       risk_score = 70 \
| table _time, host, auid, uid, comm, exe, name, detection_name, mitre_technique, risk_score
description = Creation or modification of systemd unit/timer files -- the modern, reboot-surviving Linux persistence and privilege mechanism (units run as root by default). A .timer paired with a .service is the systemd equivalent of a scheduled task.\
\
ATT&CK: T1543.002 (Systemd Service). Data source: auditd (key=persist_systemd).\
FALSE POSITIVES: package installs create units -- correlate with dpkg. TRIAGE: read ExecStart; a unit pointing at a binary in a user-writable path, or one written by a shell rather than the package manager, is suspect.
