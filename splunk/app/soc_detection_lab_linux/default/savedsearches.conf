counttype = number of events
quantity = 0
relation = greater than


#############################  PRIVILEGE ESCALATION  ###################

[SOCLAB-LNX - T1548.003 - Sudoers Modified or Unauthorized Sudo]
search = (`linux_audit` key=priv_sudoers) \
      OR (`linux_auth` sudo ("user NOT in sudoers" OR "incorrect password attempts" OR "authentication failure")) \
| eval detection_name = "Sudoers Tampering / Unauthorized Sudo", \
       mitre_technique = "T1548.003", \
       risk_score = 75 \
| table _time, host, auid, uid, comm, exe, name, key, _raw, detection_name, mitre_technique, risk_score
description = Two signals for sudo abuse: any write to /etc/sudoers or /etc/sudoers.d (auditd key=priv_sudoers) -- how an attacker grants themselves passwordless root -- and auth.log lines showing a user who is NOT in sudoers attempting sudo, a privilege-probing signal.\
\
ATT&CK: T1548.003 (Abuse Elevation Control Mechanism: Sudo and Sudo Caching). Data source: auditd + auth.log.\
FALSE POSITIVES: legitimate admin edits via visudo -- correlate with a change ticket. TRIAGE: read the sudoers change; a NOPASSWD entry for a non-admin account is a backdoor.
