# Dedicated indexes keep endpoint telemetry separate from Splunk's internal logs,
# so retention and the 500 MB/day Free-tier ingest budget can be reasoned about per source.

[wineventlog]
homePath   = $SPLUNK_DB\wineventlog\db
coldPath   = $SPLUNK_DB\wineventlog\colddb
thawedPath = $SPLUNK_DB\wineventlog\thaweddb
# 30 days is enough to demo retention policy without filling a laptop disk.
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 20480

[sysmon]
homePath   = $SPLUNK_DB\sysmon\db
coldPath   = $SPLUNK_DB\sysmon\colddb
thawedPath = $SPLUNK_DB\sysmon\thaweddb
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 20480

[notable]
# Summary index. Every correlation search writes its results here, so the triage
# dashboard and the risk-rollup search read from one small index instead of
# re-running 18 searches against raw data.
homePath   = $SPLUNK_DB\notable\db
coldPath   = $SPLUNK_DB\notable\colddb
thawedPath = $SPLUNK_DB\notable\thaweddb
frozenTimePeriodInSecs = 15552000
maxTotalDataSizeMB = 2048

[linux]
# auditd + auth.log + syslog from the Ubuntu victim endpoint.
homePath   = $SPLUNK_DB\linux\db
coldPath   = $SPLUNK_DB\linux\colddb
thawedPath = $SPLUNK_DB\linux\thaweddb
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 20480

[attack_range]
# Notes, detonation manifests, and Atomic Red Team execution logs.
homePath   = $SPLUNK_DB\attack_range\db
coldPath   = $SPLUNK_DB\attack_range\colddb
thawedPath = $SPLUNK_DB\attack_range\thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 1024
