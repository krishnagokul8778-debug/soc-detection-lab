# Search macros. Every detection references these instead of hardcoding index names,
# so re-pointing the lab at a different index or sourcetype is a one-line change.

# Sourcetypes below match the classic (renderXml=0) inputs in
# vm-setup/inputs.conf. If you install the Splunk Add-on for Microsoft Sysmon
# and switch to renderXml=1, change "WinEventLog:" to "XmlWinEventLog:" here
# and every detection follows automatically -- that is the whole reason the
# index and sourcetype are behind a macro instead of inlined 18 times.

[sysmon]
definition = index=sysmon sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational"
iseval = 0

[wineventlog]
definition = index=wineventlog sourcetype="WinEventLog:Security"
iseval = 0

[powershell_operational]
definition = index=wineventlog sourcetype="WinEventLog:Microsoft-Windows-PowerShell/Operational"
iseval = 0

# System channel -- 7045 service installs and 104 log clears live here, not in Security.
[wineventlog_system]
definition = index=wineventlog sourcetype="WinEventLog:System"
iseval = 0

[sysmon_process_create]
definition = `sysmon` EventCode=1
iseval = 0

[sysmon_registry]
definition = `sysmon` (EventCode=12 OR EventCode=13 OR EventCode=14)
iseval = 0

[sysmon_network]
definition = `sysmon` EventCode=3
iseval = 0

# Strips the noisy default domain/host suffixes so results are readable in a notable table.
[detection_output]
definition = table _time, host, user, parent_process_name, process_name, process, mitre_technique, detection_name \
| sort - _time
iseval = 0

# Lab-only allowlist. In production this would be a lookup maintained by the SOC,
# not an inline macro -- calling that out is half the point of having it here.
[known_admin_tooling]
definition = NOT (process_name IN ("SenseIR.exe","MsMpEng.exe","MpCmdRun.exe") OR user IN ("SYSTEM$"))
iseval = 0
# Linux telemetry macros live in the separate soc_detection_lab_linux app.
