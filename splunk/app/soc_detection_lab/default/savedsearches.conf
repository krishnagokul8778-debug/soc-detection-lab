###############################  IMPACT  ###############################

[SOCLAB - T1490 - Shadow Copy Deletion or Recovery Disabled]
search = `sysmon_process_create` \
  ((process_name=vssadmin.exe AND CommandLine="*delete*shadow*") \
   OR (process_name=wmic.exe AND CommandLine="*shadowcopy*delete*") \
   OR (process_name=bcdedit.exe AND (CommandLine="*recoveryenabled*no*" OR CommandLine="*bootstatuspolicy*ignoreallfailures*")) \
   OR (process_name=wbadmin.exe AND CommandLine="*delete*") \
   OR (CommandLine="*Remove-Item*VSS*") \
   OR (process_name=vssadmin.exe AND CommandLine="*resize*shadowstorage*")) \
| eval detection_name = "Shadow Copy Deletion or Recovery Disabled", \
       mitre_technique = "T1490", \
       risk_score = 100 \
| table _time, host, User, ParentImage, Image, CommandLine, detection_name, mitre_technique, risk_score
description = Destroying Volume Shadow Copies and disabling Windows recovery is the last step before ransomware encrypts -- it removes the victim's ability to roll back. This is the highest-severity rule in the catalog and the one that should page a human at 3am.\
\
Note the vssadmin "resize shadowstorage" variant: shrinking the shadow storage area silently evicts existing snapshots without ever calling delete, and rules that only match on "delete shadows" miss it entirely.\
\
ATT&CK: T1490 (Inhibit System Recovery)\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: Essentially none on a workstation. Some backup products manage shadow storage, which is the only realistic benign source and should be allowlisted by signed image path.\
\
TRIAGE: This is not a triage-at-leisure alert. If encryption has not started yet you have minutes. (1) Isolate the host from the network immediately. (2) Identify the parent process and the account. (3) Check every other host for the same pattern -- ransomware deploys broadly and near-simultaneously. (4) Preserve memory before powering off if the capability exists; encryption keys are often still resident.
