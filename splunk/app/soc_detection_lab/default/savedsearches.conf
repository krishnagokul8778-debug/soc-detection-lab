#############################  PERSISTENCE  ############################

[SOCLAB - T1547.001 - Registry Run Key Persistence]
search = `sysmon_registry` \
  (TargetObject="*\\CurrentVersion\\Run\\*" \
   OR TargetObject="*\\CurrentVersion\\RunOnce\\*" \
   OR TargetObject="*\\CurrentVersion\\RunServices\\*" \
   OR TargetObject="*\\CurrentVersion\\Explorer\\Shell Folders*" \
   OR TargetObject="*\\Winlogon\\Shell" \
   OR TargetObject="*\\Winlogon\\Userinit") \
| eval detection_name = "Registry Run Key Persistence", \
       mitre_technique = "T1547.001", \
       risk_score = 70 \
| table _time, host, User, Image, TargetObject, Details, detection_name, mitre_technique, risk_score
description = Autorun registry keys are the most common persistence mechanism in commodity malware because they need no elevation (HKCU) and survive reboot. Winlogon Shell and Userinit are included because overwriting them is a stealthier variant that many Run-key-only rules miss.\
\
ATT&CK: T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder)\
Data source: Sysmon EventCode 12/13 (RegistryEvent)\
\
FALSE POSITIVES: High volume. Legitimate software writes Run keys at install time constantly. This rule is only usable with baselining -- the value is in the Details field (what is being launched), not in the fact that a key changed. Suppress by known-good Image + Details pairs.\
\
TRIAGE: (1) Read Details for the target binary path. Anything under AppData, ProgramData, Public or Temp is suspicious regardless of name. (2) Which process wrote the key? A Run key written by an installer is expected; one written by powershell.exe is not. (3) Check whether the referenced binary exists and when it was created (EventCode 11).
