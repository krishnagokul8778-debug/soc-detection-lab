####################  PRIVILEGE ESCALATION / ACCOUNTS  #################

[SOCLAB - T1136.001 - Local Account Created and Added to Privileged Group]
search = `wineventlog` (EventCode=4720 OR EventCode=4732 OR EventCode=4728 OR EventCode=4756) \
| eval target = coalesce(TargetUserName, Member_Name, MemberName) \
| stats min(_time) as _time, \
        values(EventCode) as events, \
        values(TargetUserName) as new_account, \
        values(Group_Name) as group_name, \
        values(SubjectUserName) as actor \
        by host \
```Creation alone is worth noting; creation followed by a group add inside the``` \
```window is the full attacker pattern and should outrank it.``` \
| where mvcount(events) > 1 OR in(events, "4732") \
| eval detection_name = "Account Created and Added to Privileged Group", \
       mitre_technique = "T1136.001", \
       risk_score = 80 \
| table _time, host, actor, new_account, group_name, events, detection_name, mitre_technique, risk_score
description = Correlates account creation (4720) with privileged group membership changes (4732 local, 4728 global, 4756 universal) on the same host. Creating an account is mildly interesting on its own; creating one and immediately granting it Administrators is a textbook backdoor-account pattern.\
\
ATT&CK: T1136.001 (Create Account: Local Account), T1098 (Account Manipulation)\
Data source: Windows Security 4720, 4732, 4728, 4756\
\
FALSE POSITIVES: Legitimate IT provisioning looks identical in the logs. The discriminators are timing (out of hours), the acting account, and whether a corresponding ticket exists. This is a good example of a detection that needs organisational context a SIEM does not have.\
\
TRIAGE: (1) Does the new account follow the naming convention? Attackers often pick plausible names like "svc_backup" or append a trailing character to a real account. (2) Was the actor's own session legitimate? Pivot to their 4624. (3) Disable rather than delete the account so it stays available for forensics.
