[SOCLAB - T1204.002 - Office Application Spawning a Shell]
search = `sysmon_process_create` \
  ParentImage IN ("*\\WINWORD.EXE","*\\EXCEL.EXE","*\\POWERPNT.EXE","*\\OUTLOOK.EXE","*\\MSACCESS.EXE","*\\MSPUB.EXE") \
  process_name IN ("cmd.exe","powershell.exe","pwsh.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe","regsvr32.exe","bitsadmin.exe","certutil.exe","curl.exe") \
| eval detection_name = "Office Application Spawning a Shell", \
       mitre_technique = "T1204.002", \
       risk_score = 95 \
| table _time, host, User, ParentImage, Image, CommandLine, detection_name, mitre_technique, risk_score
description = An Office document spawning a script interpreter is the canonical macro-phishing execution chain. This is one of the highest-precision detections in the catalog: there is almost no benign reason for Word to launch PowerShell.\
\
ATT&CK: T1204.002 (User Execution: Malicious File), T1566.001 (Spearphishing Attachment)\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: A small number of legitimate business macros shell out, usually to cmd.exe for file operations. Any that exist should be identified during baselining and allowlisted by document hash, not by suppressing the rule.\
\
TRIAGE: (1) Recover the originating document -- check Sysmon EventCode 11 for recent writes to the Outlook temp directory or Downloads. (2) Pull the child command line; it usually contains the C2 URL outright. (3) Check EventCode 3 for outbound connections from the child process. (4) This is a confirmed-compromise starting point: identify the recipient, then search mail logs for other recipients of the same attachment.
