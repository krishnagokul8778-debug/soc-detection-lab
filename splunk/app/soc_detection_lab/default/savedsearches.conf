[SOCLAB - T1070.001 - Windows Event Log Cleared]
search = ```1102 is written to Security, 104 to System -- different channels, and a``` \
```single sourcetype filter would silently miss half of this detection.``` \
(`wineventlog` EventCode=1102) OR (`wineventlog_system` EventCode=104) \
| eval detection_name = "Windows Event Log Cleared", \
       mitre_technique = "T1070.001", \
       risk_score = 85 \
| table _time, host, user, EventCode, Message, detection_name, mitre_technique, risk_score
description = Event ID 1102 (Security log cleared) and 104 (other log cleared) fire when an attacker destroys forensic evidence. The event itself cannot be suppressed by clearing the log -- it is written as the first record of the newly emptied log, which is exactly why it is worth alerting on.\
\
ATT&CK: T1070.001 (Indicator Removal: Clear Windows Event Logs)\
Data source: Windows Security 1102, System 104\
\
FALSE POSITIVES: Nearly zero on a workstation. Some imaging and sysprep workflows clear logs during provisioning -- correlate against your build pipeline before alerting in production.\
\
TRIAGE: (1) Because the log was cleared, local evidence is gone by definition -- everything already forwarded to Splunk is now your only record. This is the argument for forwarding logs off-host in real time, and worth saying out loud in an interview. (2) Identify the account that cleared it and whether it had any business doing so. (3) Reconstruct the pre-clear timeline from indexed data and look for what the attacker was trying to erase.
