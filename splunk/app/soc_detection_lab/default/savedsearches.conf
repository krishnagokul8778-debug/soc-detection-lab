########################################################################
# SOC Detection Lab -- correlation searches
#
# Conventions used by every rule below:
#   * cron offsets are staggered so 16 searches do not all fire at :00
#     and stall a laptop-class indexer.
#   * dispatch.earliest_time overlaps the schedule interval by ~2x. Events
#     arriving late (forwarder buffering, clock skew in the guest) would
#     otherwise fall between two windows and never be evaluated.
#   * every rule emits mitre_technique + detection_name so results from
#     different rules can be unioned into one triage dashboard.
#   * risk_score is 0-100, hand-assigned by confidence x impact. It drives
#     the "Risk by Host" panel -- a single medium-confidence hit is noise,
#     but four on one host inside an hour is an incident.
#   * results are summary-indexed to `notable` so the triage dashboard reads
#     from one place instead of re-running 16 correlation searches.
########################################################################


##########################  CREDENTIAL ACCESS  #########################

[SOCLAB - T1003.001 - LSASS Memory Access from Unexpected Process]
search = `sysmon` EventCode=10 TargetImage="*\\lsass.exe" \
| eval granted = lower(GrantedAccess) \
```0x1010 = PROCESS_VM_READ|QUERY_INFO -- the classic minidump combo.``` \
```0x1410 / 0x143a are what procdump, comsvcs.dll and Mimikatz request.``` \
| search granted IN ("0x1010","0x1410","0x143a","0x1438","0x1f0fff","0x1fffff") \
```Legitimate readers of LSASS on a clean endpoint. On a real network this``` \
```belongs in a lookup owned by the SOC, not inlined -- see docs/tuning.md.``` \
| search NOT SourceImage IN ("C:\\Windows\\System32\\wininit.exe", \
                             "C:\\Windows\\System32\\csrss.exe", \
                             "C:\\Windows\\System32\\services.exe", \
                             "C:\\Program Files\\Windows Defender\\MsMpEng.exe") \
| eval detection_name = "LSASS Memory Access from Unexpected Process", \
       mitre_technique = "T1003.001", \
       risk_score = 90 \
| table _time, host, User, SourceImage, TargetImage, granted, detection_name, mitre_technique, risk_score
description = Flags any process opening a handle to lsass.exe with read/clone access rights. This is the single highest-fidelity credential-dumping signal available from Sysmon, because almost nothing on a workstation has a legitimate reason to read LSASS memory.\
\
ATT&CK: T1003.001 (OS Credential Dumping: LSASS Memory)\
Data source: Sysmon EventCode 10 (ProcessAccess)\
\
FALSE POSITIVES: EDR and AV products read LSASS constantly -- if you install Defender for Endpoint, CrowdStrike or SentinelOne in the lab, their binaries must be allowlisted or this rule becomes unusable. Some backup and DLP agents also trip it.\
\
TRIAGE: (1) Is SourceImage signed and running from its expected path? (2) Pivot on the SourceImage process GUID to Sysmon EventCode 1 and read the full command line. (3) Check EventCode 11 for a .dmp file written near the same timestamp. (4) If a dump landed on disk, treat every credential cached on that host as burned.
cron_schedule = 2,17,32,47 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
action.summary_index = 1
action.summary_index._name = notable
counttype = number of events
quantity = 0
relation = greater than


[SOCLAB - T1003.002 - SAM or SECURITY Hive Dumped via reg.exe]
search = `sysmon_process_create` process_name=reg.exe \
| search CommandLine="*save*" \
| search (CommandLine="*hklm\\sam*" OR CommandLine="*hklm\\system*" OR CommandLine="*hklm\\security*") \
| eval detection_name = "SAM/SECURITY Hive Dumped via reg.exe", \
       mitre_technique = "T1003.002", \
       risk_score = 85 \
| table _time, host, User, ParentImage, Image, CommandLine, detection_name, mitre_technique, risk_score
description = Detects `reg save hklm\sam` and siblings -- the offline credential-theft path used when a process cannot touch LSASS directly. Dumping SAM + SYSTEM together yields local account NTLM hashes crackable offline.\
\
ATT&CK: T1003.002 (OS Credential Dumping: Security Account Manager)\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: Very rare. Legitimate backup or forensic imaging is the only realistic source, and both should be pre-announced and change-controlled.\
\
TRIAGE: (1) Read the full command line for the output path and go find that file. (2) Check whether SYSTEM was saved alongside SAM -- SAM alone is useless to an attacker, both together is a complete offline crack. (3) Look for subsequent file-transfer or archive activity moving the hives off-box.
