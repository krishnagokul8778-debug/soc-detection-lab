[SOCLAB - T1110 - Failed Logon Burst Followed by Success]
search = `wineventlog` (EventCode=4625 OR EventCode=4624) \
| bin _time span=5m \
| stats count(eval(EventCode=4625)) as failures, \
        count(eval(EventCode=4624)) as successes, \
        dc(eval(if(EventCode=4625, TargetUserName, null()))) as users_tried, \
        values(LogonType) as logon_types, \
        values(IpAddress) as src_ips \
        by _time, host \
| where failures >= 10 \
| eval outcome = if(successes > 0, "SUCCESS AFTER FAILURES", "failures only"), \
```A burst that ends in a successful logon is a probable compromise, not a probe.``` \
       risk_score = if(successes > 0, 90, 45), \
       detection_name = "Failed Logon Burst", \
       mitre_technique = if(users_tried > 5, "T1110.003", "T1110.001") \
| table _time, host, failures, successes, users_tried, outcome, logon_types, src_ips, detection_name, mitre_technique, risk_score
description = Threshold detection for brute-force and password-spray activity, bucketed into 5-minute windows. The technique ID is assigned dynamically: many failures against many distinct accounts is password spraying (T1110.003), many against one account is straightforward brute force (T1110.001). Risk doubles when a successful logon lands in the same window as the failures.\
\
ATT&CK: T1110.001 (Password Guessing), T1110.003 (Password Spraying)\
Data source: Windows Security 4625, 4624\
\
FALSE POSITIVES: Common and mundane -- expired passwords, a stale mapped drive, a service account with rotated credentials, or a phone re-syncing mail. Check the Sub Status code in 4625: 0xC0000064 (no such user) suggests enumeration, 0xC000006A (bad password) on a valid account suggests guessing.\
\
TRIAGE: (1) Source IP -- internal or external? Internal means an already-compromised host. (2) If a success followed, that session is the priority; pull everything that account did afterwards. (3) Distinguish a human typo pattern (a few attempts, then a pause) from automation (uniform sub-second intervals).\
\
NOTE: the threshold of 10 is a lab value. Set it from a real baseline; picking a threshold by measurement rather than by guess is exactly the question an interviewer wants you to answer.
