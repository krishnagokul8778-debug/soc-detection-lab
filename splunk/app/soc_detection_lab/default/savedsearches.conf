##############################  DISCOVERY  #############################

[SOCLAB - T1082 - Host and Domain Discovery Command Burst]
search = `sysmon_process_create` \
  process_name IN ("whoami.exe","hostname.exe","systeminfo.exe","net.exe","net1.exe","nltest.exe","ipconfig.exe","arp.exe","route.exe","netstat.exe","tasklist.exe","query.exe","quser.exe","wmic.exe","dsquery.exe","reg.exe") \
| bin _time span=10m \
| stats dc(process_name) as distinct_tools, \
        values(process_name) as tools_used, \
        values(CommandLine) as command_lines, \
        values(ParentImage) as parents, \
        count as total_executions \
        by _time, host, User \
```Any one of these is normal admin behaviour. Five different ones inside ten``` \
```minutes from one parent is an operator running a recon playbook.``` \
| where distinct_tools >= 5 \
| eval detection_name = "Host and Domain Discovery Command Burst", \
       mitre_technique = "T1082", \
       risk_score = 20 + (distinct_tools * 8) \
| table _time, host, User, distinct_tools, tools_used, parents, command_lines, detection_name, mitre_technique, risk_score
description = No single discovery command is suspicious -- administrators run whoami and ipconfig all day. The signal is the BURST: five or more distinct enumeration utilities from one user inside ten minutes is the signature of an operator working through a situational-awareness checklist immediately after landing on a host.\
\
This rule is the clearest illustration in the catalog of behavioural versus atomic detection, and it is worth leading with in an interview: it detects the human on the keyboard rather than any particular tool, so it survives the attacker swapping net.exe for a custom binary.\
\
ATT&CK: T1082 (System Information Discovery), T1033, T1016, T1018, T1087, T1049, T1057\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: Genuine troubleshooting by an administrator, and any inventory or monitoring script that sweeps the same utilities on a schedule. Scripted sources are easy to tune out by ParentImage; a human admin investigating an outage is not, and needs context to resolve.\
\
TRIAGE: (1) Look at the parent process -- cmd.exe under explorer.exe is a person, cmd.exe under a service or an Office app is not. (2) Check what ran immediately before the burst; the initial access event is usually seconds earlier. (3) Check what ran immediately after -- recon is followed by credential access or lateral movement, and those are the events that matter.
