[SOCLAB - T1562.001 - Defender Tampering or Exclusion Added]
search = (`sysmon_registry` TargetObject="*\\Windows Defender\\Exclusions\\*") \
      OR (`sysmon_process_create` CommandLine="*Add-MpPreference*Exclusion*") \
      OR (`sysmon_process_create` CommandLine="*Set-MpPreference*Disable*") \
      OR (`sysmon_registry` TargetObject="*\\Windows Defender\\*" TargetObject IN ("*DisableAntiSpyware","*DisableRealtimeMonitoring","*DisableBehaviorMonitoring","*DisableIOAVProtection")) \
| eval detection_name = "Defender Tampering or Exclusion Added", \
       mitre_technique = "T1562.001", \
       risk_score = 88 \
| table _time, host, User, Image, CommandLine, TargetObject, Details, detection_name, mitre_technique, risk_score
description = Detects attackers blinding Microsoft Defender before dropping payloads -- either by adding a path/extension/process exclusion or by flipping the real-time protection registry values. Adding an exclusion for C:\\Users\\Public and then staging a payload there is a very common ransomware precursor.\
\
ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)\
Data source: Sysmon EventCode 13 (RegistryValueSet) + EventCode 1\
\
FALSE POSITIVES: Legitimate. Developers and IT add exclusions for build directories and line-of-business apps. The discriminator is who did it and where from: an exclusion added by GPO or SCCM is routine, one added by a PowerShell process whose parent is winword.exe is not.\
\
TRIAGE: (1) What path or process was excluded? Go look at that path immediately. (2) Was the change made by an interactive user, a script, or policy? (3) Check whether anything executed from the excluded path afterwards. (4) Exclusions are persistent -- confirm removal as part of remediation, not just process termination.
