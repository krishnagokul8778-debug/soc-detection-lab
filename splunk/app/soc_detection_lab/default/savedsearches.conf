counttype = number of events
quantity = 0
relation = greater than


##############################  EXECUTION  #############################

[SOCLAB - T1059.001 - Encoded PowerShell Command]
search = `sysmon_process_create` (process_name=powershell.exe OR process_name=pwsh.exe) \
```Matches -enc, -EncodedCommand and every legal abbreviation between them.``` \
| regex CommandLine="(?i)\\s-[eE]{1}[ncodemaNCODEMA]*\\s+[A-Za-z0-9+/=]{40,}" \
| eval detection_name = "Encoded PowerShell Command", \
       mitre_technique = "T1059.001", \
       risk_score = 65 \
| table _time, host, User, ParentImage, CommandLine, detection_name, mitre_technique, risk_score
description = Catches base64-encoded PowerShell payloads. PowerShell accepts any unambiguous abbreviation of -EncodedCommand (-e, -en, -enc, -encod...), so the regex matches the abbreviation family rather than a fixed string -- writing this rule as CommandLine="*-enc *" is the classic evasion gap and is worth demonstrating deliberately.\
\
ATT&CK: T1059.001 (Command and Scripting Interpreter: PowerShell), T1027 (Obfuscated Files or Information)\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: Real. SCCM/Intune, Chocolatey, and several vendor installers legitimately use encoded commands to avoid quoting problems. Baseline for a week before trusting this rule; tune by ParentImage rather than by decoded content.\
\
TRIAGE: (1) Decode the blob -- `| eval decoded = base64decode(payload)` gets you most of the way, though PowerShell uses UTF-16LE so expect null bytes between characters. (2) Correlate with PowerShell 4104 script-block logs on the same host for the decoded body. (3) Check the parent process: winword.exe or outlook.exe spawning encoded PowerShell is a phishing payload, not an installer.
