[SOCLAB - T1543.003 - Suspicious Service Installation]
search = ```7045 lives on System, 4697 on Security -- both are collected.``` \
(`wineventlog_system` EventCode=7045) OR (`wineventlog` EventCode=4697) \
| eval svc = lower(coalesce(ServiceFileName, Service_File_Name)) \
| eval susp_path   = if(match(svc, "(\\\\users\\\\|\\\\appdata\\\\|\\\\programdata\\\\|\\\\temp\\\\|\\\\public\\\\)"), 1, 0), \
       susp_interp = if(match(svc, "(powershell|cmd\\.exe|wscript|cscript|mshta|rundll32)"), 1, 0), \
       susp_encode = if(match(svc, "(-enc|frombase64|-w hidden|-nop)"), 1, 0) \
| where susp_path=1 OR susp_interp=1 OR susp_encode=1 \
| eval detection_name = "Suspicious Service Installation", \
       mitre_technique = "T1543.003", \
       risk_score = 85 \
| table _time, host, user, ServiceName, svc, ServiceType, StartType, detection_name, mitre_technique, risk_score
description = Service creation is both persistence and privilege escalation -- services run as SYSTEM by default. Rather than alerting on every 7045 (far too noisy, every software install creates services), this filters to services whose binary path lives in a user-writable directory, invokes a script interpreter, or carries encoded arguments. That is the shape of PsExec-style lateral movement and of most service-based persistence.\
\
ATT&CK: T1543.003 (Create or Modify System Process: Windows Service), T1569.002 (Service Execution)\
Data source: Windows System 7045, Security 4697\
\
FALSE POSITIVES: Low after the path/interpreter filter. Some legitimate agents install from ProgramData -- baseline those.\
\
TRIAGE: (1) Look at the service binary path and the service name -- attackers often pick names that mimic real Windows services with subtle misspellings. (2) A randomly-named service created remotely is PsExec or an equivalent; the source host is in scope too. (3) Check StartType: auto-start means it survives reboot.
