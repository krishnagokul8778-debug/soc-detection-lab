[SOCLAB - T1047 - WMI Process Creation]
search = `sysmon_process_create` (process_name=wmic.exe OR ParentImage="*\\WmiPrvSE.exe") \
| search (CommandLine="*process*call*create*" OR ParentImage="*\\WmiPrvSE.exe") \
| search NOT process_name IN ("wmiprvse.exe","WmiApSrv.exe") \
| eval detection_name = "WMI Process Creation", \
       mitre_technique = "T1047", \
       risk_score = 70 \
| table _time, host, User, ParentImage, Image, CommandLine, detection_name, mitre_technique, risk_score
description = Detects process execution through WMI, both the wmic.exe `process call create` form and any child spawned by WmiPrvSE.exe. WMI is a favourite lateral-movement and fileless-execution channel because it leaves no binary on disk and predates most script-logging controls.\
\
ATT&CK: T1047 (Windows Management Instrumentation)\
Data source: Sysmon EventCode 1 (ProcessCreate)\
\
FALSE POSITIVES: Monitoring agents, inventory tools and SCCM use WMI heavily. WmiPrvSE spawning a known management binary is normal; WmiPrvSE spawning cmd.exe or powershell.exe rarely is.\
\
TRIAGE: (1) Was this local or remote? Check Security 4624 Logon Type 3 on the same host within a few seconds. (2) Identify the calling user and whether that account should be administering this host. (3) If remote, the source host is now also in scope.
