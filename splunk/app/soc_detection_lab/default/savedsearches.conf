###########################  DEFENSE EVASION  ##########################

[SOCLAB - T1218 - Suspicious LOLBin Execution with Network Egress]
search = `sysmon` (EventCode=1 OR EventCode=3) \
  process_name IN ("rundll32.exe","regsvr32.exe","mshta.exe","certutil.exe","bitsadmin.exe","msiexec.exe","installutil.exe","regasm.exe","regsvcs.exe","msbuild.exe") \
```Collapse the ProcessCreate and NetworkConnect events for one process GUID``` \
```into a single row, so the alert shows the command line AND where it called out.``` \
| stats min(_time) as _time, \
        values(CommandLine) as CommandLine, \
        values(ParentImage) as ParentImage, \
        values(User) as User, \
        values(DestinationIp) as DestinationIp, \
        values(DestinationPort) as DestinationPort, \
        values(DestinationHostname) as DestinationHostname \
        by host, process_name, ProcessGuid \
```A LOLBin that only ran is interesting; one that ran AND phoned home is an incident.``` \
| where isnotnull(DestinationIp) \
| eval detection_name = "LOLBin Execution with Network Egress", \
       mitre_technique = "T1218", \
       risk_score = 80 \
| table _time, host, User, ParentImage, process_name, CommandLine, DestinationIp, DestinationPort, DestinationHostname, detection_name, mitre_technique, risk_score
description = Living-off-the-land binaries are signed Microsoft executables abused to proxy execution and downloads past application allowlisting. This rule joins ProcessCreate to NetworkConnect on ProcessGuid and only alerts when the LOLBin actually made an outbound connection -- which cuts the false-positive rate enormously versus alerting on execution alone.\
\
ATT&CK: T1218 (System Binary Proxy Execution), T1105 (Ingress Tool Transfer)\
Data source: Sysmon EventCode 1 + EventCode 3, correlated on ProcessGuid\
\
FALSE POSITIVES: msiexec.exe and certutil.exe both have legitimate network-facing uses (installing from a URL, fetching a CRL). certutil reaching a Microsoft CRL endpoint is normal; certutil reaching a raw IP or a paste site is not.\
\
TRIAGE: (1) Resolve DestinationIp -- reputation, ASN, and whether the org has ever talked to it before. (2) Read the command line for a URL and an output path. (3) If a file was downloaded, hash it and check EventCode 1 for subsequent execution. (4) Note that ProcessGuid correlation means you already have the parent chain -- walk it back to the initial access vector.
