############################  RISK ROLLUP  #############################

[SOCLAB - Risk-Based Alerting - Host Risk Threshold Exceeded]
search = index=notable earliest=-24h \
| stats sum(risk_score) as total_risk, \
        dc(detection_name) as distinct_detections, \
        dc(mitre_technique) as distinct_techniques, \
        values(detection_name) as detections_fired, \
        values(mitre_technique) as techniques, \
        min(_time) as first_seen, \
        max(_time) as last_seen \
        by host \
```Two independent detections is the floor -- a single medium-risk hit is a``` \
```ticket, but distinct techniques on one host inside a day is a kill chain.``` \
| where total_risk >= 120 AND distinct_detections >= 2 \
| eval dwell_minutes = round((last_seen - first_seen) / 60, 1), \
       detection_name = "Host Risk Threshold Exceeded", \
       mitre_technique = "multiple" \
| sort - total_risk \
| table host, total_risk, distinct_detections, distinct_techniques, dwell_minutes, techniques, detections_fired
description = Risk-Based Alerting rollup. Instead of paging on every individual detection, low- and medium-confidence hits accumulate risk against the host, and the analyst is alerted only when one host crosses a threshold with at least two distinct detections behind it.\
\
This is the rule that turns the catalog from a pile of alerts into something resembling how a real SOC operates, and it is the most valuable thing in the project to be able to explain. The argument: individually tuning every rule to near-zero false positives is impossible, and trying to do it means either alert fatigue or blind spots. RBA lets you keep noisy-but-meaningful detections (Run key persistence, discovery bursts) enabled at low risk contribution, where they are worthless alone but decisive in combination.\
\
Real Splunk Enterprise Security implements this with risk modifiers and a risk index; this is a deliberately simplified version built on a summary index, which is worth stating plainly rather than overselling.\
\
TRIAGE: (1) Read the technique list as a kill chain -- discovery then credential access then persistence tells a story that no single alert does. (2) dwell_minutes shows how long the activity ran before crossing the threshold; consistently high values are an argument for lowering the threshold. (3) Investigate the host as a whole, not each contributing alert separately.
cron_schedule = 5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than
