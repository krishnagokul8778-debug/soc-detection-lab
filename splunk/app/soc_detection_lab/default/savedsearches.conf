##########################  LATERAL MOVEMENT  ##########################

[SOCLAB - T1021.002 - Remote Admin Share Access]
search = `wineventlog` EventCode=5140 (ShareName="*ADMIN$*" OR ShareName="*C$*" OR ShareName="*IPC$*") \
| search NOT IpAddress IN ("-","127.0.0.1","::1") \
| stats min(_time) as _time, values(ShareName) as shares, count as access_count \
        by host, SubjectUserName, IpAddress \
| eval detection_name = "Remote Admin Share Access", \
       mitre_technique = "T1021.002", \
       risk_score = 65 \
| table _time, host, SubjectUserName, IpAddress, shares, access_count, detection_name, mitre_technique, risk_score
description = Access to ADMIN$, C$ and IPC$ from a remote address is how PsExec, wmiexec, smbexec and most manual lateral movement stage payloads and return output. Requires the "Audit File Share" subcategory to be enabled -- it is off by default, and turning it on is part of the lab build.\
\
ATT&CK: T1021.002 (Remote Services: SMB/Windows Admin Shares)\
Data source: Windows Security 5140\
\
FALSE POSITIVES: Substantial in a managed environment -- SCCM, vulnerability scanners, backup agents and remote-management tooling all use admin shares legitimately. Allowlist by source IP (the management subnet), not by account.\
\
TRIAGE: (1) Is the source IP a known management host? (2) Correlate with 4624 Logon Type 3 for the same account and timestamp. (3) Check the destination host for a service creation (7045) or new process within seconds -- that combination is PsExec-style execution and confirms lateral movement rather than a file copy.
