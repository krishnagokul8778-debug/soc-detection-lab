[SOCLAB - T1027 - Obfuscated PowerShell Script Block]
search = `powershell_operational` EventCode=4104 \
| eval sb = lower(ScriptBlockText) \
| eval ind_frombase64   = if(match(sb, "frombase64string"), 1, 0), \
       ind_iex          = if(match(sb, "(invoke-expression|\\biex\\b)"), 1, 0), \
       ind_downloadstr  = if(match(sb, "(downloadstring|downloaddata|invoke-webrequest|invoke-restmethod|net\\.webclient)"), 1, 0), \
       ind_amsi         = if(match(sb, "(amsiutils|amsiinitfailed|amsiscanbuffer)"), 1, 0), \
       ind_hidden       = if(match(sb, "(-w\\s+hidden|-windowstyle\\s+hidden|-nop\\b|-noprofile)"), 1, 0), \
       ind_reflect      = if(match(sb, "(reflection\\.assembly|getdelegateforfunctionpointer|virtualalloc|writeprocessmemory)"), 1, 0), \
       ind_charconcat   = if(match(sb, "(\\[char\\]|-join|-replace).*(\\[char\\]|-join|-replace)"), 1, 0) \
| eval obf_score = ind_frombase64 + ind_iex + ind_downloadstr + (ind_amsi * 3) + ind_hidden + (ind_reflect * 2) + ind_charconcat \
| where obf_score >= 3 \
| eval matched = mvfilter(match(mvappend( \
      if(ind_frombase64=1,"FromBase64String",null()), \
      if(ind_iex=1,"Invoke-Expression",null()), \
      if(ind_downloadstr=1,"Web download cradle",null()), \
      if(ind_amsi=1,"AMSI bypass",null()), \
      if(ind_hidden=1,"Hidden window / no profile",null()), \
      if(ind_reflect=1,"Reflective loading",null()), \
      if(ind_charconcat=1,"Character-level obfuscation",null())), ".")) \
| eval detection_name = "Obfuscated PowerShell Script Block", \
       mitre_technique = "T1027", \
       risk_score = min(95, 40 + (obf_score * 10)) \
| table _time, host, user, obf_score, matched, ScriptBlockText, detection_name, mitre_technique, risk_score
description = Scores PowerShell script blocks against a weighted set of obfuscation and tradecraft indicators rather than matching one string. Any single indicator is weak evidence; three or more together is a payload. AMSI-bypass and reflective-loading indicators are weighted heavily because they have essentially no benign use.\
\
This rule is the strongest argument in the catalog for enabling Script Block Logging (Group Policy: Administrative Templates > Windows Components > Windows PowerShell > Turn on PowerShell Script Block Logging). 4104 records the DECODED script body, so it defeats -EncodedCommand entirely -- an attacker can obfuscate what goes into the command line but not what the engine ultimately executes.\
\
ATT&CK: T1027 (Obfuscated Files or Information), T1059.001, T1562.001 (AMSI bypass)\
Data source: Microsoft-Windows-PowerShell/Operational EventCode 4104\
\
FALSE POSITIVES: Legitimate admin and installer scripts commonly use FromBase64String or a download cradle in isolation, which is why the threshold is 3 rather than 1. Tune by raising the threshold, not by removing indicators.\
\
TRIAGE: (1) Read ScriptBlockText -- unlike command lines, this is the real decoded payload. (2) Large scripts are split across multiple 4104 events; reassemble using ScriptBlockId and MessageNumber before concluding anything. (3) An AMSI-bypass hit alone justifies isolating the host.
