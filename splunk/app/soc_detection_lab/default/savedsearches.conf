[SOCLAB - T1053.005 - Scheduled Task Created]
search = (`sysmon_process_create` process_name=schtasks.exe CommandLine="*/create*") \
      OR (`wineventlog` EventCode=4698) \
| eval detection_name = "Scheduled Task Created", \
       mitre_technique = "T1053.005", \
       risk_score = 60 \
| table _time, host, User, Image, CommandLine, TaskName, detection_name, mitre_technique, risk_score
description = Covers scheduled-task persistence from two angles: the schtasks.exe command line (Sysmon 1) and the authoritative Security 4698 event. Both are included deliberately -- 4698 requires the "Audit Other Object Access Events" subcategory to be enabled, which it is not by default, and tasks created through the COM API or PowerShell's Register-ScheduledTask never touch schtasks.exe at all. Neither source alone gives full coverage.\
\
ATT&CK: T1053.005 (Scheduled Task/Job: Scheduled Task)\
Data source: Sysmon EventCode 1 + Windows Security 4698\
\
FALSE POSITIVES: Moderate to high. Windows and third-party software create tasks routinely. Tasks running as SYSTEM, triggering at logon, or executing from a user-writable directory are the interesting subset.\
\
TRIAGE: (1) What does the task run, as which user, on what trigger? 4698 carries the full task XML. (2) Tasks that execute a script interpreter with an encoded argument are effectively always malicious. (3) Confirm the task is removed during remediation -- deleting the payload without deleting the task leaves a broken but re-infectable trigger.
