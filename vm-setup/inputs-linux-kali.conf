########################################################################
# Splunk Universal Forwarder inputs for the KALI attacker box.
# Deploy to: /home/gokul/splunkforwarder/etc/apps/soc_lab_inputs_linux/local/inputs.conf
#   (this UF was extracted to /home/gokul/splunkforwarder, not /opt)
#
# Same index/sourcetype scheme as the Ubuntu victim (inputs-linux.conf) so the
# existing index=linux detections fire unchanged. Differences vs Ubuntu:
#   * Kali default user is `gokul` (not the Ubuntu victim user).
#   * auditd is NOT installed on Kali by default -- the audit.log input is
#     harmless if the file is absent (UF just skips it), but you get nothing
#     until you `sudo apt install auditd` and load a ruleset. See note below.
#   * These logs are root-owned (auth.log/syslog 640 root:adm, audit.log 600
#     root) -- the UF must run as root to read them. That is exactly what
#     `enable boot-start -user root` gives you; do NOT rely on the gokul-owned
#     process for these inputs.
########################################################################

[monitor:///var/log/auth.log]
index = linux
sourcetype = linux_secure
disabled = 0

[monitor:///var/log/syslog]
index = linux
sourcetype = syslog
disabled = 0

# auditd. Only produces data after: sudo apt install -y auditd
# then load a ruleset (e.g. the same ATT&CK-keyed rules used on the victim).
# crcSalt guards the read checkpoint across log rotation.
[monitor:///var/log/audit/audit.log]
index = linux
sourcetype = linux:audit
disabled = 0
crcSalt = <SOURCE>

# Attacker command history is a high-value source on the Kali box specifically
# (it captures what tools/commands were launched). Requires timestamped history:
#   echo 'export HISTTIMEFORMAT="%F %T "' >> /home/gokul/.bashrc
#   shopt -s histappend
# Enabled here (unlike the victim) because it is the point of monitoring Kali.
[monitor:///home/gokul/.bash_history]
index = linux
sourcetype = bash_history
disabled = 0
