########################################################################
# Splunk Universal Forwarder inputs for the Ubuntu victim.
# Deploy to: /opt/splunkforwarder/etc/apps/soc_lab_inputs_linux/local/inputs.conf
# (provision-victim-ubuntu.sh does this automatically if staged.)
#
# All three sources land in index=linux and are separated by sourcetype so a
# detection can target the right one. Field extraction:
#   * linux:audit  -- auditd key=value pairs auto-extract in Splunk (comm, exe,
#                     key, auid, uid, success, name...). No add-on required, but
#                     installing Splunk_TA_nix on the indexer gives cleaner CIM
#                     fields and full EXECVE argv reconstruction -- recommended
#                     but optional, same trade-off as the Windows Sysmon TA.
#   * linux_secure -- pretrained sourcetype; auth/sudo/su events from auth.log.
########################################################################

[monitor:///var/log/audit/audit.log]
index = linux
sourcetype = linux:audit
disabled = 0
# audit.log is mode 600 root -- the forwarder runs as root in this lab so it
# can read it. crcSalt guards against the checkpoint resetting on log rotation.
crcSalt = <SOURCE>

[monitor:///var/log/auth.log]
index = linux
sourcetype = linux_secure
disabled = 0

[monitor:///var/log/syslog]
index = linux
sourcetype = syslog
disabled = 0

# Bash history with timestamps is a cheap, high-value forensic source for the
# lab. Requires HISTTIMEFORMAT set and histappend -- the provisioning script
# does not force this globally, so treat this input as best-effort.
[monitor:///home/.../.bash_history]
index = linux
sourcetype = bash_history
disabled = 1
