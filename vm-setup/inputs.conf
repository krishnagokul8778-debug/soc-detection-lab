########################################################################
# Universal Forwarder inputs for the victim endpoint.
# Deploy to: <UF>\etc\apps\soc_lab_inputs\local\inputs.conf
#
# FORMAT CHOICE: these use classic WinEventLog inputs rather than
# XmlWinEventLog (renderXml=1). XML is higher fidelity and is what the
# Splunk Add-on for Microsoft Sysmon expects, but XML events arrive as one
# unparsed blob unless that TA is installed -- and the TA needs a Splunkbase
# account. Classic format lets Splunk's built-in "Field: value" extraction
# populate Image, CommandLine, TargetImage etc. with no add-on at all, so the
# lab works standalone. If you later install the Sysmon TA, flip renderXml to
# 1 and update the `sysmon` macro to the XmlWinEventLog sourcetype.
########################################################################

###############################  SYSMON  ###############################

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = 0
# Without this, Splunk ships the numeric SID instead of a username and every
# detection that groups by User produces unreadable results.
evt_resolve_ad_obj = 1
# Only ship events generated from now on. Omitting this replays the entire
# existing log on first start, which on a 1 GB channel will blow through the
# Free-tier 500 MB/day licence in one go.
current_only = 0
start_from = oldest
checkpointInterval = 5

##########################  WINDOWS SECURITY  ##########################

[WinEventLog://Security]
disabled = 0
index = wineventlog
renderXml = 0
evt_resolve_ad_obj = 1
start_from = oldest
checkpointInterval = 5
# Security is by far the highest-volume channel. This allowlist keeps only the
# event IDs the detections actually reference. On a laptop-class lab this is
# the difference between ~50 MB/day and several hundred -- and it is also just
# good practice: ingest what you detect on, not everything you can collect.
#   4624/4625 logon success+failure     4720/4726 account create/delete
#   4728/4732/4756 group membership     4688 process create (w/ cmdline)
#   4697 service install                4698/4699/4702 scheduled tasks
#   1102 log cleared                    5140/5145 file share access
#   4104 is on the PowerShell channel, not here
whitelist = 1102,4624,4625,4648,4672,4688,4697,4698,4699,4702,4719,4720,4722,4724,4726,4728,4732,4738,4756,4768,4769,4776,5140,5145

###########################  WINDOWS SYSTEM  ###########################

[WinEventLog://System]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
checkpointInterval = 5
# 7045 = service installed (used by the T1543.003 detection)
# 7040 = service start type changed
# 104  = event log cleared
# 7034/7031 = service crashed, sometimes the fingerprint of a failed exploit
whitelist = 104,7031,7034,7035,7036,7040,7045

#############################  POWERSHELL  #############################

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
checkpointInterval = 5
# 4104 script block (the decoded payload), 4103 module/pipeline,
# 4105/4106 script start/stop
whitelist = 4103,4104,4105,4106

# The legacy channel. Still worth collecting: 400/403/600 fire on PowerShell
# v2 downgrade attacks (powershell -version 2), which is a deliberate evasion
# to escape script block logging entirely -- v2 does not support it.
[WinEventLog://Windows PowerShell]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
whitelist = 400,403,600,800

######################  TASK SCHEDULER / WMI  ##########################

[WinEventLog://Microsoft-Windows-TaskScheduler/Operational]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
whitelist = 106,140,141,200,201

# WMI event subscriptions are a fileless persistence mechanism that leaves no
# process and no registry Run key. 5861 is the event that exposes it.
[WinEventLog://Microsoft-Windows-WMI-Activity/Operational]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
whitelist = 5857,5858,5859,5860,5861

#####################  DEFENDER / ATOMIC RED TEAM  #####################

[WinEventLog://Microsoft-Windows-Windows Defender/Operational]
disabled = 0
index = wineventlog
renderXml = 0
start_from = oldest
# 1116/1117 detection+action, 5001 real-time protection disabled,
# 5007 configuration changed (catches exclusion additions)
whitelist = 1006,1007,1008,1116,1117,5001,5004,5007,5010,5012

# Execution log written by Invoke-AtomicRedTeam, so detonations can be joined
# against detections by timestamp to build the validation matrix automatically.
[monitor://C:\AtomicRedTeam\atomic-logs\*.csv]
disabled = 0
index = attack_range
sourcetype = atomic_red_team_execution
crcSalt = <SOURCE>
